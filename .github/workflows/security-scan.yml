name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 6 AM UTC
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit (production deps)
        continue-on-error: true
        run: npm audit --production

  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt

  trivy:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image for scanning
        run: docker build -f backend/Dockerfile -t flowstral-backend:scan ./backend

      - name: Build frontend image for scanning
        run: docker build -f Dockerfile.frontend -t flowstral-frontend:scan .

      - name: Build worker image for scanning
        run: docker build -f backend/Dockerfile.worker -t flowstral-worker:scan ./backend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: flowstral-backend:scan
          format: table
          severity: CRITICAL,HIGH

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: flowstral-frontend:scan
          format: table
          severity: CRITICAL,HIGH

      - name: Scan worker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: flowstral-worker:scan
          format: table
          severity: CRITICAL,HIGH
