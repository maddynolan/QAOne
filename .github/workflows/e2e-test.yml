name: QA AI Platform End-to-End Test

on:
  workflow_dispatch:
    inputs:
      test_plan_name:
        description: 'Name for the test plan'
        required: true
        default: 'E2E Test Plan'
      test_spec:
        description: 'Test specification content'
        required: true
        default: |
          {
            "openapi": "3.0.0",
            "info": {
              "title": "QA AI Platform API",
              "version": "1.0.0"
            },
            "paths": {
              "/health": {
                "get": {
                  "summary": "Health check endpoint",
                  "responses": {
                    "200": {
                      "description": "Service is healthy"
                    }
                  }
                }
              }
            }
          }

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qaai_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        # Backend dependencies
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
        # Frontend dependencies
        cd ../frontend
        npm ci
        
        # Test tools
        npm install -g newman playwright
        playwright install --with-deps
    
    - name: Setup database
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qaai_e2e
        REDIS_URL: redis://localhost:6379
      run: |
        # Create database schema
        psql -h localhost -U postgres -d qaai_e2e -f sql/init.sql
    
    - name: Start backend server
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qaai_e2e
        REDIS_URL: redis://localhost:6379
        ENVIRONMENT: test
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 15
    
    - name: Start frontend server
      working-directory: ./frontend
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
      run: |
        npm run build
        npm start &
        sleep 15
    
    - name: Wait for services
      run: |
        # Wait for backend
        for i in {1..30}; do
          if curl -f http://localhost:8000/health; then
            echo "Backend is ready"
            break
          fi
          echo "Waiting for backend... ($i/30)"
          sleep 2
        done
        
        # Wait for frontend
        for i in {1..30}; do
          if curl -f http://localhost:3000; then
            echo "Frontend is ready"
            break
          fi
          echo "Waiting for frontend... ($i/30)"
          sleep 2
        done
    
    - name: Run E2E Test Flow
      env:
        TEST_PLAN_NAME: ${{ github.event.inputs.test_plan_name }}
        TEST_SPEC: ${{ github.event.inputs.test_spec }}
      run: |
        echo "Starting E2E test flow..."
        
        # Step 1: Create Test Plan
        echo "Step 1: Creating test plan..."
        PLAN_RESPONSE=$(curl -s -X POST http://localhost:8000/generate_test_plan \
          -H "Content-Type: application/json" \
          -d "{
            \"name\": \"$TEST_PLAN_NAME\",
            \"description\": \"E2E test plan created by GitHub Action\",
            \"source\": \"$TEST_SPEC\",
            \"targets\": {\"endpoints\": [\"/health\", \"/api/test\"]},
            \"api_ui\": {\"api\": true, \"ui\": false, \"performance\": false, \"accessibility\": false},
            \"priority\": 1
          }")
        
        PLAN_ID=$(echo $PLAN_RESPONSE | jq -r '.data.plan_id')
        echo "Created plan with ID: $PLAN_ID"
        
        if [ "$PLAN_ID" = "null" ] || [ -z "$PLAN_ID" ]; then
          echo "Failed to create test plan"
          echo "Response: $PLAN_RESPONSE"
          exit 1
        fi
        
        # Step 2: Create Test Suite
        echo "Step 2: Creating test suite..."
        SUITE_RESPONSE=$(curl -s -X POST http://localhost:8000/create_tests \
          -H "Content-Type: application/json" \
          -d "{
            \"plan_id\": \"$PLAN_ID\",
            \"name\": \"E2E Test Suite\",
            \"test_type\": \"postman\",
            \"artifacts\": [{
              \"type\": \"postman\",
              \"path\": \"e2e-collection.json\",
              \"content\": \"{\\\"info\\\": {\\\"name\\\": \\\"E2E Collection\\\"}, \\\"item\\\": [{\\\"name\\\": \\\"Health Check\\\", \\\"request\\\": {\\\"method\\\": \\\"GET\\\", \\\"url\\\": {\\\"raw\\\": \\\"http://localhost:8000/health\\\"}}}]}\"
            }]
          }")
        
        SUITE_ID=$(echo $SUITE_RESPONSE | jq -r '.data.suite_id')
        echo "Created suite with ID: $SUITE_ID"
        
        if [ "$SUITE_ID" = "null" ] || [ -z "$SUITE_ID" ]; then
          echo "Failed to create test suite"
          echo "Response: $SUITE_RESPONSE"
          exit 1
        fi
        
        # Step 3: Run Tests
        echo "Step 3: Running tests..."
        RUN_RESPONSE=$(curl -s -X POST http://localhost:8000/run_tests \
          -H "Content-Type: application/json" \
          -d "{
            \"suite_id\": \"$SUITE_ID\",
            \"name\": \"E2E Test Run\"
          }")
        
        RUN_ID=$(echo $RUN_RESPONSE | jq -r '.data.run_id')
        echo "Started run with ID: $RUN_ID"
        
        if [ "$RUN_ID" = "null" ] || [ -z "$RUN_ID" ]; then
          echo "Failed to start test run"
          echo "Response: $RUN_RESPONSE"
          exit 1
        fi
        
        # Step 4: Wait for completion and check results
        echo "Step 4: Waiting for test completion..."
        for i in {1..60}; do
          RUN_STATUS=$(curl -s http://localhost:8000/runs | jq -r ".items[] | select(.run_id == \"$RUN_ID\") | .status")
          
          if [ "$RUN_STATUS" = "passed" ]; then
            echo "✅ Tests passed successfully!"
            break
          elif [ "$RUN_STATUS" = "failed" ] || [ "$RUN_STATUS" = "error" ]; then
            echo "❌ Tests failed with status: $RUN_STATUS"
            
            # Get detailed results
            echo "Getting detailed results..."
            curl -s http://localhost:8000/runs | jq ".items[] | select(.run_id == \"$RUN_ID\")"
            exit 1
          elif [ "$RUN_STATUS" = "running" ]; then
            echo "Tests still running... ($i/60)"
            sleep 5
          else
            echo "Unknown status: $RUN_STATUS"
            sleep 5
          fi
        done
        
        if [ "$RUN_STATUS" != "passed" ]; then
          echo "❌ Tests did not complete in time"
          exit 1
        fi
        
        # Step 5: Test Triage (if there were failures)
        echo "Step 5: Testing triage functionality..."
        TRIAGE_RESPONSE=$(curl -s -X POST http://localhost:8000/triage_failures \
          -H "Content-Type: application/json" \
          -d "{
            \"run_id\": \"$RUN_ID\",
            \"name\": \"E2E Triage Test\"
          }")
        
        echo "Triage response: $TRIAGE_RESPONSE"
        
        # Step 6: Test Reports
        echo "Step 6: Testing reports..."
        REPORTS_RESPONSE=$(curl -s http://localhost:8000/reports)
        echo "Reports response: $REPORTS_RESPONSE"
        
        echo "🎉 E2E test flow completed successfully!"
    
    - name: Cleanup
      if: always()
      run: |
        echo "Cleaning up..."
        # Kill any remaining processes
        pkill -f uvicorn || true
        pkill -f "npm start" || true
        pkill -f "next start" || true
