# Alertmanager Configuration for Flowstral/QAAI Platform
# Receives alerts from Prometheus and routes them to receivers.
#
# Configure via environment variables:
#   ALERTMANAGER_WEBHOOK_URL  — Webhook receiver URL (Slack, PagerDuty, custom)
#   SMTP_FROM                — Email sender address
#   SMTP_SMARTHOST           — SMTP server (host:port)
#   SMTP_AUTH_USERNAME       — SMTP username
#   SMTP_AUTH_PASSWORD       — SMTP password
#   ALERT_EMAIL_TO           — Email recipient for alerts

global:
  resolve_timeout: 5m
  smtp_from: '${SMTP_FROM:-alerts@flowstral.com}'
  smtp_smarthost: '${SMTP_SMARTHOST:-smtp.gmail.com:587}'
  smtp_auth_username: '${SMTP_AUTH_USERNAME:-}'
  smtp_auth_password: '${SMTP_AUTH_PASSWORD:-}'
  smtp_require_tls: true

# Templates for alert notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree — determines how alerts are grouped and routed
route:
  receiver: 'default-webhook'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts — immediate notification, no grouping delay
    - match:
        severity: critical
      receiver: 'critical-webhook'
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h

    # Warning alerts — standard grouping
    - match:
        severity: warning
      receiver: 'default-webhook'
      group_wait: 5m
      group_interval: 10m
      repeat_interval: 4h

# Inhibition rules — suppress lower-severity alerts when higher-severity fires
inhibit_rules:
  # If a critical alert fires, suppress warnings for the same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']

  # If ServiceDown fires, suppress HighErrorRate and HighLatency
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: 'HighErrorRate|HighLatency'

# Receivers — notification endpoints
receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: '${ALERTMANAGER_WEBHOOK_URL:-http://localhost:9095/webhook}'
        send_resolved: true

  - name: 'critical-webhook'
    webhook_configs:
      - url: '${ALERTMANAGER_WEBHOOK_URL:-http://localhost:9095/webhook}'
        send_resolved: true
    email_configs:
      - to: '${ALERT_EMAIL_TO:-ops@flowstral.com}'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] Flowstral Alert: {{ .GroupLabels.alertname }}'
