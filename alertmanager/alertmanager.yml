# Alertmanager Configuration for Flowstral/QAAI Platform
# Receives alerts from Prometheus and routes them to receivers.
#
# IMPORTANT: Alertmanager does NOT support shell-style ${VAR} env-var substitution.
# You MUST replace all placeholder values below before deploying.
# Alternatively, use a Docker entrypoint script with `envsubst` to template this file
# at container startup from environment variables.
#
# Required values to replace:
#   CHANGE_ME_smtp_from          — Email sender address (e.g., alerts@flowstral.com)
#   CHANGE_ME_smtp_smarthost     — SMTP server host:port (e.g., smtp.gmail.com:587)
#   CHANGE_ME_smtp_username      — SMTP authentication username
#   CHANGE_ME_smtp_password      — SMTP authentication password
#   CHANGE_ME_webhook_url        — Webhook receiver URL (Slack, PagerDuty, custom)
#   CHANGE_ME_alert_email        — Email recipient for critical alerts

global:
  resolve_timeout: 5m
  smtp_from: 'CHANGE_ME_smtp_from'
  smtp_smarthost: 'CHANGE_ME_smtp_smarthost'
  smtp_auth_username: 'CHANGE_ME_smtp_username'
  smtp_auth_password: 'CHANGE_ME_smtp_password'
  smtp_require_tls: true

# Templates for alert notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree — determines how alerts are grouped and routed
route:
  receiver: 'default-webhook'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts — immediate notification, no grouping delay
    - match:
        severity: critical
      receiver: 'critical-webhook'
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h

    # Warning alerts — standard grouping
    - match:
        severity: warning
      receiver: 'default-webhook'
      group_wait: 5m
      group_interval: 10m
      repeat_interval: 4h

# Inhibition rules — suppress lower-severity alerts when higher-severity fires
inhibit_rules:
  # If a critical alert fires, suppress warnings for the same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']

  # If ServiceDown fires, suppress HighErrorRate and HighLatency
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: 'HighErrorRate|HighLatency'

# Receivers — notification endpoints
receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'CHANGE_ME_webhook_url'
        send_resolved: true

  - name: 'critical-webhook'
    webhook_configs:
      - url: 'CHANGE_ME_webhook_url'
        send_resolved: true
    email_configs:
      - to: 'CHANGE_ME_alert_email'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] Flowstral Alert: {{ .GroupLabels.alertname }}'
