// Protocol Buffers definition for Test Website gRPC API
// Use this .proto file to test gRPC protocol in Apex

syntax = "proto3";

package testwebsite;

option go_package = "testwebsite/proto";

// Product Service
service ProductService {
  // Get a single product by ID
  rpc GetProduct(GetProductRequest) returns (ProductResponse);
  
  // List products with filters
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  
  // Get products count
  rpc GetProductsCount(GetProductsCountRequest) returns (GetProductsCountResponse);
  
  // Create a new product
  rpc CreateProduct(CreateProductRequest) returns (ProductResponse);
  
  // Update an existing product
  rpc UpdateProduct(UpdateProductRequest) returns (ProductResponse);
}

// Order Service
service OrderService {
  // Create a new order
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  
  // Get order by ID
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
  
  // List orders for current user
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  
  // Update order status
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (OrderResponse);
}

// Cart Service
service CartService {
  // Get cart items
  rpc GetCart(GetCartRequest) returns (GetCartResponse);
  
  // Add item to cart
  rpc AddToCart(AddToCartRequest) returns (CartItemResponse);
  
  // Update cart item quantity
  rpc UpdateCartItem(UpdateCartItemRequest) returns (CartItemResponse);
  
  // Remove item from cart
  rpc RemoveFromCart(RemoveFromCartRequest) returns (RemoveFromCartResponse);
  
  // Clear cart
  rpc ClearCart(ClearCartRequest) returns (ClearCartResponse);
}

// User Service
service UserService {
  // Get current user info
  rpc GetCurrentUser(GetCurrentUserRequest) returns (UserResponse);
  
  // Get user by ID
  rpc GetUser(GetUserRequest) returns (UserResponse);
  
  // Register new user
  rpc Register(RegisterRequest) returns (AuthResponse);
  
  // Login user
  rpc Login(LoginRequest) returns (AuthResponse);
}

// Product Messages
message GetProductRequest {
  int32 product_id = 1;
}

message ListProductsRequest {
  int32 skip = 1;
  int32 limit = 2;
  optional int32 category_id = 3;
  optional string search = 4;
  optional double min_price = 5;
  optional double max_price = 6;
  optional string sort_by = 7;
  optional string order = 8;
}

message ListProductsResponse {
  repeated Product products = 1;
  int32 total = 2;
}

message GetProductsCountRequest {
  optional int32 category_id = 1;
  optional string search = 2;
  optional double min_price = 3;
  optional double max_price = 4;
}

message GetProductsCountResponse {
  int32 count = 1;
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  double price = 3;
  int32 category_id = 4;
  int32 stock = 5;
  optional string image_url = 6;
  optional string sku = 7;
}

message UpdateProductRequest {
  int32 product_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional double price = 4;
  optional int32 stock = 5;
}

message ProductResponse {
  Product product = 1;
}

message Product {
  int32 id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock = 5;
  int32 category_id = 6;
  optional string image_url = 7;
  string sku = 8;
  double rating = 9;
  int32 review_count = 10;
  bool is_active = 11;
  map<string, string> metadata = 12;
  string created_at = 13;
}

// Order Messages
message CreateOrderRequest {
  ShippingAddress shipping_address = 1;
  string payment_method = 2;
}

message GetOrderRequest {
  int32 order_id = 1;
}

message ListOrdersRequest {
  int32 skip = 1;
  int32 limit = 2;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int32 total = 2;
}

message UpdateOrderStatusRequest {
  int32 order_id = 1;
  string status = 2;
}

message OrderResponse {
  Order order = 1;
}

message Order {
  int32 id = 1;
  int32 user_id = 2;
  string status = 3;
  double total_amount = 4;
  ShippingAddress shipping_address = 5;
  string payment_method = 6;
  string created_at = 7;
  repeated OrderItem items = 8;
}

message OrderItem {
  int32 id = 1;
  int32 product_id = 2;
  int32 quantity = 3;
  double price = 4;
}

message ShippingAddress {
  string street = 1;
  string city = 2;
  string state = 3;
  string zip = 4;
  string country = 5;
}

// Cart Messages
message GetCartRequest {
  // Empty - uses auth token
}

message GetCartResponse {
  repeated CartItem items = 1;
}

message AddToCartRequest {
  int32 product_id = 1;
  int32 quantity = 2;
}

message UpdateCartItemRequest {
  int32 cart_item_id = 1;
  int32 quantity = 2;
}

message RemoveFromCartRequest {
  int32 cart_item_id = 1;
}

message ClearCartRequest {
  // Empty
}

message RemoveFromCartResponse {
  bool success = 1;
}

message ClearCartResponse {
  bool success = 1;
}

message CartItemResponse {
  CartItem item = 1;
}

message CartItem {
  int32 id = 1;
  int32 product_id = 2;
  int32 quantity = 3;
  Product product = 4;
}

// User Messages
message GetCurrentUserRequest {
  // Empty - uses auth token
}

message GetUserRequest {
  int32 user_id = 1;
}

message RegisterRequest {
  string email = 1;
  string username = 2;
  string password = 3;
  optional string full_name = 4;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message UserResponse {
  User user = 1;
}

message AuthResponse {
  string access_token = 1;
  string token_type = 2;
  User user = 3;
}

message User {
  int32 id = 1;
  string email = 2;
  string username = 3;
  optional string full_name = 4;
  bool is_admin = 5;
  string created_at = 6;
}


