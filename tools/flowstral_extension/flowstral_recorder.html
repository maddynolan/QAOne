<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowstral - Action Graph Intelligence Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            width: 400px;
            max-height: 600px;
        }
        
        .flowstral-panel {
            background: white;
            padding: 20px;
        }
        
        .flowstral-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .flowstral-logo {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-active {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .status-stopped {
            background: #f5f5f5;
            color: #666;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .stat-card {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }
        
        .stat-label {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-start {
            background: #4CAF50;
            color: white;
        }
        
        .btn-stop {
            background: #f44336;
            color: white;
        }
        
        .config-section {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .log {
            max-height: 150px;
            overflow-y: auto;
            font-size: 11px;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
        }
        
        .log-entry {
            margin-bottom: 5px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="flowstral-panel">
        <div class="flowstral-header">
            <div class="flowstral-logo">⭐ Flowstral</div>
            <div class="status-badge status-stopped" id="statusBadge">⏹ Stopped</div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="nodeCount">0</div>
                <div class="stat-label">Nodes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="edgeCount">0</div>
                <div class="stat-label">Edges</div>
            </div>
        </div>
        
        <div class="button-group">
            <button class="btn-start" id="btnStart">▶ Start</button>
            <button class="btn-stop" id="btnStop" disabled>⏹ Stop</button>
        </div>
        
        <div class="config-section">
            <label>Project ID:</label>
            <input type="text" id="projectId" placeholder="Enter project ID">
        </div>
        
        <div class="log" id="log"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
