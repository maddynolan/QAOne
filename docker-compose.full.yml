# Docker Compose for Full On-Prem Deployment
# Phase 4.2: On-Prem Packaging — Security-Hardened
#
# SETUP: Copy .env.example to .env and fill in all required values before starting.
# Required env vars: POSTGRES_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD,
#                    JWT_SECRET_KEY, ENCRYPTION_KEY

version: '3.8'

services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qaai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qaai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-qaai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qaai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qaai-network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # MinIO (S3-compatible object store)
  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: qaai-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - qaai-network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Redis (for queues and caching)
  redis:
    image: redis:7-alpine
    container_name: qaai-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qaai-network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Backend API
  # Default: cloud LLM only (OPENAI_API_KEY / ANTHROPIC_API_KEY). OLLAMA not used unless enabled below.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qaai-backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-qaai}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-qaai}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?err}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?err}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-qa-artifacts}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Cloud LLM (set in .env): OPENAI_API_KEY, ANTHROPIC_API_KEY
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
      TRACK_LLM_USAGE: "true"
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-50}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    networks:
      - qaai-network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # OLLAMA (local LLM) - NOT USED BY DEFAULT. We use cloud API keys (OpenAI/Anthropic).
  # Uncomment the block below and backend env OLLAMA_URL + DEFAULT_LLM_PROVIDER=local_qwen to use local LLM.
  # ---------------------------------------------------------------------------
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: qaai-ollama
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   ports:
  #     - "11434:11434"
  #   networks:
  #     - qaai-network
  #   security_opt:
  #     - no-new-privileges:true
  #   restart: unless-stopped
  #   # Models: docker exec qaai-ollama ollama pull qwen2.5-coder:14b

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: qaai-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - qaai-network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Test Runner Workers (Playwright)
  test-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: qaai-test-worker
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-qaai}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-qaai}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      WORKER_ID: worker-1
      WORKER_CAPACITY: ${WORKER_CAPACITY:-5}
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - qaai-network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

volumes:
  postgres_data:
  minio_data:
  redis_data:
  # ollama_data:  # Uncomment if using ollama service
  backend_logs:

networks:
  qaai-network:
    driver: bridge



