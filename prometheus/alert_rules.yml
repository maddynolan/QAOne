groups:
  - name: flowstral-alerts
    rules:
      # ── Application Health ──

      # NOTE: FastAPI instrumentators (e.g., prometheus-fastapi-instrumentator) typically
      # emit the label "status_code" (not "status"). Verify your backend's metric labels
      # match these PromQL expressions.
      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate ({{ $value | humanizePercentage }})"
          description: "More than 5% of HTTP requests are returning 5xx errors for the last 5 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency ({{ $value | humanizeDuration }})"
          description: "P95 request latency exceeds 5 seconds for the last 5 minutes."

      - alert: ServiceDown
        expr: up{job="flowstral-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Flowstral backend is down"
          description: "The Flowstral backend service has been unreachable for more than 2 minutes."

      # ── Database ──

      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL is unreachable. Application will fall back to in-memory storage."

      # ── AI/LLM Budget ──
      # NOTE: The "llm_tokens_total" metric requires custom instrumentation in the backend.
      # See backend/app/services/core/ai_settings_service.py for usage tracking.

      - alert: AIBudgetExceeded
        expr: rate(llm_tokens_total[1h]) * 0.00001 > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI/LLM spending rate exceeds $100/hr"
          description: "LLM token usage rate suggests costs exceeding $100 per hour. Review BYOK usage."

      # ── Infrastructure ──

      - alert: HighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage ({{ $value | humanizePercentage }})"
          description: "Memory usage has been above 85% for the last 10 minutes."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space ({{ $value | humanizePercentage }} free)"
          description: "Less than 10% disk space remaining on root filesystem."

      # NOTE: The "flowstral_active_sessions" metric requires custom instrumentation.
      # Expose via Prometheus client in the backend (e.g., prometheus_client Gauge).
      - alert: HighSessionCount
        expr: flowstral_active_sessions > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High active session count ({{ $value }})"
          description: "More than 1000 active sessions. Consider scaling or investigating for session leaks."

      # ── Test Execution ──
      # NOTE: The "flowstral_test_queue_size" and "flowstral_test_results_total" metrics
      # require custom instrumentation. These should be exposed as Prometheus counters/gauges
      # in the test execution service.

      - alert: TestQueueBacklog
        expr: flowstral_test_queue_size > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Test execution queue backlog ({{ $value }} pending)"
          description: "More than 100 tests queued for over 10 minutes. Consider adding worker replicas."

      - alert: HighTestFailureRate
        expr: rate(flowstral_test_results_total{result="failed"}[1h]) / rate(flowstral_test_results_total[1h]) > 0.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "High test failure rate ({{ $value | humanizePercentage }})"
          description: "More than 50% of tests are failing in the last hour."
