version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: qa-postgres
    environment:
      POSTGRES_USER: qaai
      POSTGRES_PASSWORD: qaai123
      POSTGRES_DB: qaai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

