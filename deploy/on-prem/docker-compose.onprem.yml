# ============================================================
# Flowstral/QAAI — On-Premises Docker Compose
# ============================================================
#
# This compose file deploys the full QAAI stack for on-premises
# installations. The customer provides their own PostgreSQL.
#
# Usage:
#   1. Copy .env.template to .env and fill in values
#   2. docker compose -f docker-compose.onprem.yml up -d
#
# Containers:
#   - qaai-backend:  FastAPI backend (port 8000)
#   - qaai-frontend: React frontend served by Nginx (port 443/80)
#   - qaai-nginx:    Reverse proxy with TLS termination
#
# Requirements:
#   - Docker 24+ and Docker Compose v2+
#   - PostgreSQL 14+ (customer-provided, external)
#   - 4 CPU cores, 8GB RAM minimum
#   - TLS certificate (or Let's Encrypt via Nginx)

version: "3.8"

services:
  # ==================== Backend ====================
  qaai-backend:
    image: ghcr.io/maddynolan/qaone-backend:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile.backend
    container_name: qaai-backend
    restart: unless-stopped
    user: "1001:1001"
    environment:
      # Database (required)
      - DATABASE_URL=${DATABASE_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-qaai}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSL_MODE=${DB_SSL_MODE:-require}
      # Application
      - APP_ENV=${APP_ENV:-production}
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - FERNET_KEY=${FERNET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      # Auto-migration
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
      # AI (optional — BYOK)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      # SSO (optional)
      - SAML_SP_ENTITY_ID=${SAML_SP_ENTITY_ID:-}
      - SAML_SP_ACS_URL=${SAML_SP_ACS_URL:-}
      # Observability
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AUDIT_MODE=${AUDIT_MODE:-strict}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - qaai-data:/app/data
      - qaai-logs:/app/logs
    networks:
      - qaai-internal

  # ==================== Frontend ====================
  qaai-frontend:
    image: ghcr.io/maddynolan/qaone-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_DEMO_MODE=false
    container_name: qaai-frontend
    restart: unless-stopped
    user: "1001:1001"
    networks:
      - qaai-internal

  # ==================== Nginx Reverse Proxy ====================
  qaai-nginx:
    image: nginx:1.25-alpine
    container_name: qaai-nginx
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.onprem.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:-./certs/cert.pem}:/etc/nginx/ssl/cert.pem:ro
      - ${TLS_KEY_PATH:-./certs/key.pem}:/etc/nginx/ssl/key.pem:ro
    depends_on:
      qaai-backend:
        condition: service_healthy
      qaai-frontend:
        condition: service_started
    networks:
      - qaai-internal

volumes:
  qaai-data:
  qaai-logs:

networks:
  qaai-internal:
    driver: bridge
