; ===========================================
; PgBouncer — Connection Pooling for Flowstral
; ===========================================
; Deploy as a sidecar container on the database server
; Backend DATABASE_URL should point to PgBouncer (port 6432)
; instead of PostgreSQL directly (port 5432)
;
; Usage: docker run -v ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini pgbouncer/pgbouncer

[databases]
qaai = host=localhost port=5432 dbname=qaai

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Pool mode: transaction = connections returned after each transaction
; This allows many clients to share a small pool of database connections
pool_mode = transaction

; Maximum client connections PgBouncer will accept
max_client_conn = 200

; Default number of server connections per database
default_pool_size = 20

; Extra connections to allow temporarily when pool is full
reserve_pool_size = 5
reserve_pool_timeout = 3

; Timeout for unused server connections
server_idle_timeout = 300

; Log settings
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; Stats
stats_period = 60

; Administrative access
admin_users = qaai
