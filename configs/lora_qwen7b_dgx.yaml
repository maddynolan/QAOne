# LoRA Fine-Tuning Configuration for QA Expert Model
# Optimized for DGX Spark

base_model: "Qwen/Qwen2.5-7B-Instruct"
model_name: "qa-expert-7b"

# LoRA Configuration
lora_r: 16
lora_alpha: 16
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "v_proj"
  - "k_proj"
  - "o_proj"

# Data Paths
train_file: "data/train.jsonl"
val_file: "data/val.jsonl"

# Training Configuration
output_dir: "outputs/qa-expert-7b-v1"
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2e-5
num_train_epochs: 3
warmup_steps: 50
logging_steps: 10
save_steps: 100
eval_steps: 100
evaluation_strategy: "steps"

# Optimization
fp16: true
gradient_checkpointing: true
optim: "adamw_torch"
lr_scheduler_type: "cosine"

# DGX Spark Specific
dataloader_num_workers: 4
max_length: 2048


