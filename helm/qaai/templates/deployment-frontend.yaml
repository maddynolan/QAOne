apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qaai.fullname" . }}-frontend
  labels:
    {{- include "qaai.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount | default 2 }}
  selector:
    matchLabels:
      {{- include "qaai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "qaai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.frontend).podSecurityContext | default .Values.securityDefaults.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ (.Values.frontend).image.repository | default "qaai/frontend" }}:{{ (.Values.frontend).image.tag | default "3.21.0" }}"
          imagePullPolicy: {{ (.Values.frontend).image.pullPolicy | default "IfNotPresent" }}
          {{- with (.Values.frontend).containerSecurityContext | default .Values.securityDefaults.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml ((.Values.frontend).resources | default (dict "requests" (dict "memory" "256Mi" "cpu" "100m") "limits" (dict "memory" "512Mi" "cpu" "500m"))) | nindent 12 }}
