# Helm Values for QA-AI Platform
# Phase 4.2: On-Prem Packaging

global:
  imageRegistry: ""
  imagePullSecrets: []

# PostgreSQL
postgresql:
  enabled: true
  auth:
    username: qaai
    password: qaai_password
    database: qaai
  persistence:
    enabled: true
    size: 20Gi
  postgresqlExtendedConf:
    shared_preload_libraries: "vector"

# MinIO
minio:
  enabled: true
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin
  persistence:
    enabled: true
    size: 50Gi

# Redis
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 10Gi

# Backend API
backend:
  image:
    repository: qaai/backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8000
  env:
    DATABASE_URL: postgresql://qaai:qaai_password@postgresql:5432/qaai
    S3_ENDPOINT_URL: http://minio:9000
    REDIS_URL: redis://redis-master:6379
    OLLAMA_URL: http://ollama:11434
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# Ollama
ollama:
  enabled: true
  image:
    repository: ollama/ollama
    tag: latest
  persistence:
    enabled: true
    size: 100Gi
  resources:
    requests:
      memory: "8Gi"
      cpu: "4000m"
    limits:
      memory: "32Gi"
      cpu: "8000m"

# Test Workers
testWorkers:
  enabled: true
  replicaCount: 3
  image:
    repository: qaai/test-worker
    tag: latest
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: qaai.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: qaai-tls
      hosts:
        - qaai.example.com



