# LoRA Fine-Tuning Configuration for QA Expert Model
# Using Qwen2.5-Coder-14B (Code-focused, middle ground between 7B and 30B)
# Recommended if 7B doesn't meet quality requirements

base_model: "Qwen/Qwen2.5-Coder-14B-Instruct"
model_name: "qa-expert-14b-coder"

# LoRA Configuration
lora_r: 32
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "v_proj"
  - "k_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"

# Data Paths
train_file: "data/train.jsonl"
val_file: "data/val.jsonl"

# Training Configuration
output_dir: "outputs/qa-expert-14b-coder-v1"
per_device_train_batch_size: 1  # Reduced for 14B (needs more memory)
gradient_accumulation_steps: 8  # Increased to maintain effective batch size
learning_rate: 1e-5
num_train_epochs: 5
warmup_steps: 100
logging_steps: 10
save_steps: 100
eval_steps: 100
evaluation_strategy: "steps"

# Optimization
fp16: true
gradient_checkpointing: true  # Critical for 14B memory efficiency
optim: "adamw_torch"
lr_scheduler_type: "cosine"

# DGX Spark Specific
dataloader_num_workers: 4
max_length: 2048

# Memory Optimization
# Note: Requires ~24GB GPU memory for training
# If OOM errors occur, reduce batch_size to 1 and increase gradient_accumulation_steps




