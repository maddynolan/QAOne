# LoRA Fine-Tuning Configuration for QA Expert Model (IMPROVED)
# Optimized for better quality with Qwen2.5-7B-Instruct
# Use this if current 7B training results were poor

base_model: "Qwen/Qwen2.5-7B-Instruct"
model_name: "qa-expert-7b-v2"

# LoRA Configuration (Increased for better adaptation)
lora_r: 32  # Increased from 16
lora_alpha: 32  # Increased from 16
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "v_proj"
  - "k_proj"
  - "o_proj"
  - "gate_proj"  # Added for better adaptation
  - "up_proj"    # Added for better adaptation

# Data Paths
train_file: "data/train.jsonl"
val_file: "data/val.jsonl"

# Training Configuration (Improved)
output_dir: "outputs/qa-expert-7b-v2"
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1e-5  # Lower learning rate for better convergence
num_train_epochs: 5  # More epochs for better learning
warmup_steps: 100  # More warmup
logging_steps: 10
save_steps: 100
eval_steps: 100
evaluation_strategy: "steps"

# Optimization
fp16: true
gradient_checkpointing: true
optim: "adamw_torch"
lr_scheduler_type: "cosine"

# DGX Spark Specific
dataloader_num_workers: 4
max_length: 2048




