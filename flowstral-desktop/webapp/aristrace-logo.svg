<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium gold/purple gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="traceGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle with premium dark gradient -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGradient)"/>
  
  <!-- Outer ring - gold accent -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#goldGradient)" stroke-width="4"/>
  
  <!-- Inner decorative ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  
  <!-- Alpha symbol (α) stylized - representing "Aristo" (best) -->
  <g transform="translate(256, 240)">
    <!-- Main Alpha letter -->
    <text x="0" y="30" 
          font-family="Georgia, serif" 
          font-size="180" 
          font-weight="bold"
          fill="url(#goldGradient)" 
          text-anchor="middle">α</text>
  </g>
  
  <!-- Trace lines underneath - representing "tracing" -->
  <g transform="translate(256, 380)">
    <!-- Three trace lines -->
    <line x1="-100" y1="0" x2="-30" y2="0" stroke="url(#traceGradient)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="url(#traceGradient)" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="0" x2="100" y2="0" stroke="url(#traceGradient)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Trace dots -->
    <circle cx="-110" cy="0" r="4" fill="#818cf8"/>
    <circle cx="110" cy="0" r="4" fill="#c4b5fd"/>
  </g>
  
  <!-- Subtle corner accents -->
  <circle cx="120" cy="120" r="3" fill="url(#goldGradient)" opacity="0.6"/>
  <circle cx="392" cy="120" r="3" fill="url(#goldGradient)" opacity="0.6"/>
  <circle cx="120" cy="392" r="3" fill="url(#goldGradient)" opacity="0.6"/>
  <circle cx="392" cy="392" r="3" fill="url(#goldGradient)" opacity="0.6"/>
</svg>

